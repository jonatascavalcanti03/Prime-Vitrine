services:
  postgres:
    image: postgres:16-alpine
    container_name: prime-vitrine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prime_vitrine
    ports:
      - "5433:5432"
    volumes:
      - prime_vitrine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prime_vitrine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prime_vitrine_pgdata:
